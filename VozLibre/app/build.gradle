plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// FIRMA ESTABLE (firma continua entre versiones).
// La clave vive en el repositorio en base64 (keystore/vozlibre.jks.b64) para
// que CUALQUIER compilación (aquí o en GitHub Actions) firme SIEMPRE con la
// misma clave y las actualizaciones se instalen una encima de otra sin
// «firma incompatible». El .jks decodificado va a signing/ (ignorado por git).
// Contraseñas: vozlibre2024 (se pueden sobrescribir con VOZLIBRE_STORE_PASS
// y VOZLIBRE_KEY_PASS).
// ---------------------------------------------------------------------------
def ksFile = rootProject.file("signing/vozlibre.jks")
def ksB64 = rootProject.file("keystore/vozlibre.jks.b64")
if (!ksFile.exists() && ksB64.exists()) {
    ksFile.parentFile.mkdirs()
    ksFile.bytes = java.util.Base64.getDecoder().decode(
            ksB64.text.replace('\n', '').replace('\r', '').trim())
}
def ksExists = ksFile.exists()
def storePass = System.getenv("VOZLIBRE_STORE_PASS") ?: "vozlibre2024"
def keyPass = System.getenv("VOZLIBRE_KEY_PASS") ?: "vozlibre2024"

// ---------------------------------------------------------------------------
// EARCONS: los 11 sonidos propios (.wav, dominio público). Se copian a
// src/main/res/raw ANTES de compilar (en tiempo de configuración). Fuentes,
// por orden:
//   1. src/main/res-earcons/*.b64  (base64 dentro de esta carpeta, si existe)
//   2. ../app/src/main/res/raw/*.wav  (los WAV originales comprometidos en
//      el repositorio — mismo archivo, sonido EXACTAMENTE idéntico)
// Así cualquier compilación (local o GitHub Actions) genera los mismos
// sonidos sin binarios extra y sin dependencias externas.
// ---------------------------------------------------------------------------
def earconsB64Dir = file("src/main/res-earcons")
def earconsRawDir = file("src/main/res/raw")
// ../app/ respecto a la RAÍZ del proyecto (VozLibre/): los WAV históricos.
def legacyWavDir = rootProject.file("../app/src/main/res/raw")
earconsRawDir.mkdirs()
int copied = 0
if (earconsB64Dir.isDirectory()) {
    earconsB64Dir.listFiles().findAll { it.name.endsWith('.b64') }.each { f ->
        def out = new File(earconsRawDir,
                f.name.replaceAll('\\.b64$', ''))
        def bytes = java.util.Base64.getDecoder().decode(
                f.text.replace('\n', '').replace('\r', '').trim())
        if (!out.exists() || out.length() != bytes.length) {
            out.bytes = bytes
        }
        copied++
    }
}
if (copied == 0 && legacyWavDir.isDirectory()) {
    legacyWavDir.listFiles().findAll { it.name.endsWith('.wav') }.each { f ->
        def out = new File(earconsRawDir, f.name)
        if (!out.exists() || out.length() != f.length()) {
            out.bytes = f.bytes
        }
        copied++
    }
}
if (copied == 0) {
    logger.warn('AVISO: no se encontraron earcons (.b64 ni .wav): la app compilará sin sonidos propios.')
}

android {
    namespace 'com.vozlibre.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.vozlibre.reader"
        minSdk 24          // Android 7.0
        targetSdk 34       // Android 14
        versionCode 10     // línea 1.0.8; code 10 = la versión de la CONFIANZA sobre la
                           // base estable de la 9: notificaciones habladas al llegar
                           // (interrumpen), aviso de batería baja con porcentaje,
                           // confirmación hablada de cada acción, memoria de posición
                           // (volver al último elemento de una pantalla visitada),
                           // eco de teclas al escribir (nunca contraseñas) y ritmo
                           // por defecto coherente en los ajustes (2.5x).
        versionName "1.0.8"
    }

    signingConfigs {
        if (ksExists) {
            release {
                storeFile ksFile
                storePassword storePass
                keyAlias 'vozlibre'
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksExists ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// Sin dependencias externas: solo la API de Android.
// Esto mantiene el proyecto 100% auditable y ligero.
dependencies {
}
